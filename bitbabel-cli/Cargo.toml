[package]
name = "bitbabel-cli"
version = "0.1.0"
edition = "2024"
description = "The bitbabel command: encodes a file into a .babel file and decodes it back"
license.workspace = true

[[bin]]
name = "bitbabel"
path = "src/main.rs"

[dependencies]
bitbabel-core = { path = "../bitbabel-core" }
bitbabel-file = { path = "../bitbabel-file" }
bitbabel-tui = { path = "../bitbabel-tui", optional = true }
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"

[features]
default = ["tui"]
# The `tui` subcommand. `--no-default-features` leaves out ratatui.
tui = ["dep:bitbabel-tui"]

[lints]
workspace = true
