[package]
name = "bitbabel-web"
version = "0.1.0"
edition = "2024"
description = "The BitBabel website: a Yew app compiled to WebAssembly"
license.workspace = true
publish = false

[dependencies]
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "Storage", "Location", "Event", "EventTarget"] }
yew = { version = "0.23.0", features = ["csr"] }

[lints]
workspace = true
