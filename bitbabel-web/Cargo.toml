[package]
name = "bitbabel-web"
version = "0.1.0"
edition = "2024"
description = "The BitBabel website: a Yew app compiled to WebAssembly"
license.workspace = true
publish = false

[dependencies]
bitbabel-core = { version = "0.1.0", path = "../bitbabel-core" }
bitbabel-explorer = { version = "0.1.0", path = "../bitbabel-explorer" }
gloo-file = "0.3"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "Storage", "Location", "Event", "EventTarget", "File", "FileList", "HtmlInputElement", "Crypto", "Navigator", "Clipboard"] }
yew = { version = "0.23.0", features = ["csr"] }

[lints]
workspace = true
